[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
miroir-core = { path = "crates/miroir-core" }
anyhow = "1.0"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
