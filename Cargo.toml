[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
miroir-capture = { path = "crates/miroir-capture" }
miroir-codec = { path = "crates/miroir-codec" }
miroir-core = { path = "crates/miroir-core" }
anyhow = "1.0"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
directories = "6.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# Only the FFmpeg libraries we use, so there is less to link (and to ship on Windows).
# `format` is unused but ffmpeg-next 9.1 does not compile without it.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }
futures-util = { version = "0.3", default-features = false }
pipewire = "0.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "time"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
