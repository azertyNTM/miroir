name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg and PipeWire headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libpipewire-0.3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  windows:
    runs-on: windows-latest
    env:
      # LGPL shared build of the FFmpeg 9.0 branch (same branch as the Arch package).
      # ponytail: follows the moving `latest` tag because BtbN deletes dated builds after a
      # few weeks; mirror the archive in our own releases when packaging (phase 10).
      FFMPEG_BUILD: ffmpeg-n9.0-latest-win64-lgpl-shared-9.0
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        shell: pwsh
        run: |
          curl.exe -fsSL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_BUILD.zip"
          Expand-Archive ffmpeg.zip -DestinationPath C:\
          $dir = "C:\$env:FFMPEG_BUILD"
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          # The DLLs must be found when the test binaries start.
          "$dir\bin" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
